<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 250px;
            padding: 10px;
            font-family: sans-serif;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button#pasteBtn {
            background: #28a745;
        }

        .status {
            font-size: 12px;
            margin-top: 5px;
            color: #666;
        }
    </style>
</head>

<body>
    <h3>Hawsni Scraper</h3>
    <button id="scrapeBtn">📥 Scrape Product</button>
    <button id="pasteBtn" disabled>📋 Paste to Hawsni</button>
    <div id="status" class="status">Ready</div>
    <script src="popup.js"></script>
</body>

</html>
