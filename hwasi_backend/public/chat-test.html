<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hwasi AI Chat Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 500px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 80vh; }
        .chat-header { background: #0E4435; color: white; padding: 20px; text-align: center; }
        .chat-header h2 { margin: 0; font-size: 18px; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
        .user-msg { background: #0E4435; color: white; align-self: flex-end; border-bottom-left-radius: 4px; }
        .bot-msg { background: #f0f2f5; color: #1c1e21; align-self: flex-start; border-bottom-right-radius: 4px; border: 1px solid #e4e6eb; }
        .input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-family: inherit; }
        button { background: #0E4435; color: white; border: none; padding: 0 20px; margin-right: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:disabled { opacity: 0.5; }
        .typing { font-size: 12px; color: #888; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>✨ Hwasi AI Assistant ✨</h2>
    </div>
    <div class="messages" id="messages">
        <div class="message bot-msg">أهلاً بك في Hwasi! كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    <div class="typing" id="typing">المساعد يكتب...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب رسالتك وتتبع طلبك..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    let chatHistory = [];

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        appendMessage('user', text);
        input.value = '';
        const btn = document.getElementById('sendBtn');
        const typing = document.getElementById('typing');
        
        btn.disabled = true;
        typing.style.display = 'block';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, history: chatHistory })
            });
            const data = await response.json();
            
            if(data.success) {
                appendMessage('bot', data.reply);
                chatHistory = data.history; // Update history array from server
            } else {
                appendMessage('bot', 'عذراً، حدث خطأ: ' + data.error);
            }
        } catch (e) {
            appendMessage('bot', 'عذراً، لا يمكن الاتصال بالخادم الآن.');
        } finally {
            btn.disabled = false;
            typing.style.display = 'none';
        }
    }

    function appendMessage(sender, text) {
        const messagesDiv = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + (sender === 'user' ? 'user-msg' : 'bot-msg');
        // Handle basic markdown (bold, list)
        let htmlText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        htmlText = htmlText.replace(/\n/g, '<br>');
        msgDiv.innerHTML = htmlText;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>

</body>
</html>
