<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="hwasi - Your favorite content in one place.">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1B4D3E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="hwasi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="favicon.png" sizes="16x16" />
  <link rel="shortcut icon" href="favicon.png" type="image/png" />

  <title>hwasi</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Global fallback to prevent "tofu" squares before fonts load */
    html,
    body {
      background-color: #FAFAFA;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100dvh;
      /* Critical: Use dynamic viewport height for mobile responsiveness */
      width: 100%;
      /* Critical: Use Cairo as primary for Arabic support globally */
      font-family: 'Cairo', 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* CSS Loader - Shows immediately */
    .loading-container {

      /* CSS Loader - Shows immediately */
      .loading-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        background-color: #FAFAFA;
        transition: opacity 0.4s ease-in-out;
      }

      .loader {
        /* Optimized Simple Loader */
        width: 50px;
        height: 50px;
        border: 3px solid #E0E0E0;
        border-top: 3px solid #1B4D3E;
        /* App Primary Color */
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        display: block;
        margin-top: 16px;
        font-family: 'Cairo', sans-serif;
        font-weight: 700;
        font-size: 24px;
        color: #1B4D3E;
        animation: pulse 1.5s infinite ease-in-out;
      }

      @keyframes pulse {

        0%,
        100% {
          opacity: 0.6;
        }

        50% {
          opacity: 1;
        }
      }
  </style>

  <!-- Performance Optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="loading-indicator" class="loading-container">
    <!-- HWASI Logo/Text for Splah -->
    <div class="loading-text" style="font-size: 32px; letter-spacing: 2px; margin-bottom: 20px;">HWASI</div>
    <div class="loader"></div>
  </div>

  <!-- The Flutter bootstrapping script -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Remove loading indicator when Flutter app is ready
    window.addEventListener('load', function (ev) {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        // Delayed removal to ensure user sees the brand
        setTimeout(() => {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 400);
        }, 1500); // 1.5s delay
      }
    });
  </script>
</body>

</html>
