name: hwasi_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.13
  image_picker: ^1.1.2
  share_plus: ^12.0.1
  flutter_local_notifications: ^17.1.2
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  intl_phone_field: ^3.2.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  timezone: ^0.9.3
  smooth_page_indicator: ^1.2.1
  firebase_core: ^3.6.0
  
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.3
  permission_handler: ^12.0.1
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  photo_view: ^0.15.0
  go_router: ^17.1.0
  firebase_analytics: ^11.6.0
  firebase_messaging: ^15.2.0
  webview_flutter: ^4.13.1
  meta_seo: ^3.0.9
  visibility_detector: ^0.4.0+2
  flutter_blurhash: ^0.9.1
  add_to_cart_animation: ^2.0.4

  flutter_web_plugins:
    sdk: flutter
  video_player: ^2.8.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700