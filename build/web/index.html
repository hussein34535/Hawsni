<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- SEO Meta Tags -->
  <meta name="description" content="Hawsni - Premium Fashion & Lifestyle Shopping">
  <meta name="keywords" content="fashion, shopping, clothes, style, hawsni, egypt, ecommerce">
  <meta name="author" content="Hawsni">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hwasibackend.vercel.app/">
  <meta property="og:title" content="Hawsni - Your Style, Your Way">
  <meta property="og:description"
    content="Discover premium fashion and lifestyle products at Hawsni. Shop the latest trends with fast delivery.">
  <meta property="og:image" content="icons/Icon-192.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://hwasibackend.vercel.app/">
  <meta property="twitter:title" content="Hawsni - Your Style, Your Way">
  <meta property="twitter:description"
    content="Discover premium fashion and lifestyle products at Hawsni. Shop the latest trends with fast delivery.">
  <meta property="twitter:image" content="icons/Icon-192.png">

  <title>Hawsni</title <link rel="manifest" href="manifest.json">

  <style>
    /* Global fallback to prevent "tofu" squares before fonts load */
    html,
    body {
      background-color: #FAFAFA;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100dvh;
      /* Critical: Use dynamic viewport height for mobile responsiveness */
      width: 100%;
      /* Critical: Use Cairo as primary for Arabic support globally */
      font-family: 'Cairo', 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* CSS Loader - Shows immediately */
    /* CSS Loader - Shows immediately */
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      background-color: #FAFAFA;
      transition: opacity 0.4s ease-in-out;
    }

    .loader {
      /* Optimized Simple Loader */
      width: 50px;
      height: 50px;
      border: 3px solid #E0E0E0;
      border-top: 3px solid #1B4D3E;
      /* App Primary Color */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      display: block;
      margin-top: 16px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 24px;
      color: #1B4D3E;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }
  </style>

  <!-- Performance Optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <!-- Preload core Flutter Web Engine instantly -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload"
    href="https://www.gstatic.com/flutter-canvaskit/ddf47dd3ff96dbde6d9c614db0d7f019d7c7a2b7/chromium/canvaskit.wasm"
    as="fetch" crossorigin="anonymous">

  <!-- Cairo: all weights for full Arabic support -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=block"
    rel="stylesheet">
</head>

<body>
  <div id="loading-indicator" class="loading-container">
    <!-- HWASI Logo/Text for Splah -->
    <div class="loading-text" style="font-size: 32px; letter-spacing: 2px; margin-bottom: 20px;">HWASI</div>
    <div class="loader"></div>
  </div>

  <!-- The Flutter bootstrapping script -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Remove loading indicator when Flutter app renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400); // 400ms fade out transition
      }
    });

    // We can also hint the loader to skip service workers if we use the direct load API,
    // but in Flutter 3.22+ flutter_bootstrap.js is designed to be the main entry point.
    // The preload warning specifically mentioned flutter_bootstrap.js was not used
    // because we were loading flutter.js instead.
  </script>
</body>

</html>
