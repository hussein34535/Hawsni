<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- SEO Meta Tags -->
  <meta name="description" content="Hawsni - Premium Fashion & Lifestyle Shopping">
  <meta name="keywords" content="fashion, shopping, clothes, style, hawsni, egypt, ecommerce">
  <meta name="author" content="Hawsni">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hwasibackend.vercel.app/">
  <meta property="og:title" content="Hawsni - Your Style, Your Way">
  <meta property="og:description"
    content="Discover premium fashion and lifestyle products at Hawsni. Shop the latest trends with fast delivery.">
  <meta property="og:image" content="icons/Icon-192.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://hwasibackend.vercel.app/">
  <meta property="twitter:title" content="Hawsni - Your Style, Your Way">
  <meta property="twitter:description"
    content="Discover premium fashion and lifestyle products at Hawsni. Shop the latest trends with fast delivery.">
  <meta property="twitter:image" content="icons/Icon-192.png">

  <title>Hawsni</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // 1. FORCED ZOMBIE KILLER: Unregister Service Workers & Wipe Caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) { registration.unregister(); }
      });
      // Monkey-patch to suppress registrations silently without throwing exceptions in console
      navigator.serviceWorker.register = function () {
        return new Promise((resolve) => {
          // Resolve without doing anything to avoid "Exception" logs in flutter_bootstrap.js
          resolve({ unregister: () => Promise.resolve(true) });
        });
      };
    }
    if ('caches' in window) {
      caches.keys().then(function (names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <style>
    /* Global Reset */
    html,
    body {
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100dvh;
      width: 100%;
      font-family: 'Cairo', sans-serif;
    }

    /* Premium Splash Screen Container */
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      background-color: #FFFFFF;
      transition: opacity 0.5s ease-in-out;
    }

    /* Animated Logo */
    .splash-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
      object-fit: contain;
      animation: logo-spin 3s infinite ease-in-out;
    }

    @keyframes logo-spin {
      0% {
        transform: rotate(0deg) scale(1);
      }

      50% {
        transform: rotate(180deg) scale(1.1);
      }

      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    /* HWASI Text */
    .brand-name {
      font-size: 56px;
      font-weight: 800;
      color: #1B4D3E;
      /* Hawsni Green */
      letter-spacing: 6px;
      margin: 0;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-in-up 0.8s forwards ease-out 0.2s;
    }

    /* Subtitle */
    .tagline {
      font-size: 18px;
      color: #757575;
      letter-spacing: 1.5px;
      margin-top: 12px;
      opacity: 0;
      animation: fade-in-up 0.8s forwards ease-out 0.5s;
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Smooth transition for the loader removal */
    .loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <!-- Performance Optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload core Flutter Web Engine -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="flutter_bootstrap.js" as="script">



  <!-- Preload the Logo image used in splash -->
  <link rel="preload" href="assets/assets/images/logo.png" as="image">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Custom Splash Screen -->
  <div id="loading-indicator" class="loading-container">
    <img src="assets/assets/images/logo.png" alt="HWASI Logo" class="splash-logo">
    <h1 class="brand-name">HWASI</h1>
    <p class="tagline">Your Style, Your Way</p>
  </div>

  <!-- The Flutter bootstrapping script -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Remove loading indicator when Flutter app renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400); // 400ms fade out transition
      }
    });



    // 4. Initialize Flutter loader with EXPLICIT service worker disabling
    window.addEventListener('load', function (ev) {
      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine({
            useColorEmoji: true,
          });
          await appRunner.runApp();
        }
      });
    });
  </script>
</body>

</html>
