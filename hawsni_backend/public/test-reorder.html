<!DOCTYPE html>
<html>
<head>
    <title>Test Reorder</title>
</head>
<body>
    <h1>Test Category Reorder</h1>
    <button onclick="testReorder()">Test Reorder</button>
    <div id="result"></div>

    <script>
        async function testReorder() {
            try {
                const response = await fetch('/categories/reorder', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        categories: [
                            { id: 'test-id-1', sort_order: 0 },
                            { id: 'test-id-2', sort_order: 1 }
                        ]
                    })
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p>Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
